<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; width: 340px; padding: 16px; font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #1d1d1f; }
  h1 { font-size: 17px; margin: 0 0 4px; }
  .status { font-size: 12px; color: #6e6e73; margin-bottom: 12px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #c7c7cc; margin-right: 4px; }
  .dot.on { background: #0a7c55; } .dot.off { background: #b00020; }
  .nums { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 12px; }
  .num { background: #f5f5f7; border-radius: 8px; padding: 8px; text-align: center; }
  .num b { display: block; font-size: 16px; }
  .num span { font-size: 11px; color: #6e6e73; }
  button { width: 100%; font: inherit; font-weight: 600; padding: 10px; border: none; border-radius: 10px;
           background: #d6336c; color: #fff; cursor: pointer; }
  button:disabled { opacity: .6; cursor: progress; }
  label { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #6e6e73; margin: 8px 0 12px; }
  .summary { font-size: 15px; margin: 12px 0 8px; }
  ul { margin: 0; padding-left: 18px; }
  li { margin-bottom: 4px; }
  .err { color: #9a5b00; background: #fff4e0; border-radius: 8px; padding: 8px; font-size: 12px; margin-top: 8px; }
  .cats { font-size: 12px; color: #6e6e73; margin-top: 8px; }
  a { color: #d6336c; }
  hr { border: none; border-top: 1px solid #e5e5ea; margin: 14px 0 6px; }
  .tests { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  button.test { background: #f5f5f7; color: #1d1d1f; font-weight: 500; font-size: 12px; padding: 7px 4px; }
  button.test:hover { background: #fde7ec; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <h1>Piggyback</h1>
  <div class="status" id="status"><span class="dot"></span>Checking brain…</div>
  <button id="review">Budget review</button>
  <label><input type="checkbox" id="speak" checked> Piggyback says it out loud</label>
  <div id="result" hidden>
    <div class="nums">
      <div class="num"><b id="spent">–</b><span>spent</span></div>
      <div class="num"><b id="remaining">–</b><span>left</span></div>
      <div class="num"><b id="checkouts">–</b><span>put back</span></div>
    </div>
    <div class="summary" id="summary"></div>
    <ul id="tips"></ul>
    <div class="cats" id="cats"></div>
    <div class="err" id="err" hidden></div>
  </div>
  <hr>
  <label style="color:#1d1d1f;font-size:13px"><input type="checkbox" id="holdEverywhere" checked>
    Hold checkout on all sites (not just the demo store)</label>
  <div class="status" id="lastCart">No cart seen yet. Open your cart page.</div>
  <div class="status" id="lastSale">No sale spotted yet.</div>
  <div class="status">Piggyback brings these up at checkout. Budget and goals live on the
    <a href="http://localhost:8000/" target="_blank">dashboard</a>.</div>
  <div class="tests">
    <button class="test" id="reset">Reset visits</button>
  </div>
  <p class="status">Demo store: <a href="http://localhost:8000/store/" target="_blank">localhost:8000/store</a></p>
  <script src="popup.js"></script>
</body>
</html>
