<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8d0"/>
    </marker>
    <marker id="arrPink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ff8fb1"/>
    </marker>
  </defs>

  <rect width="1920" height="1080" fill="#0f1115"/>

  <!-- Title -->
  <text x="960" y="72" text-anchor="middle" font-size="44" font-weight="700" fill="#f1f3f5">How Piggyback works</text>
  <text x="960" y="112" text-anchor="middle" font-size="22" fill="#9aa0a6">From "Place order" to a verdict, said to your face</text>

  <!-- Column headings -->
  <text x="300" y="300" text-anchor="middle" font-size="18" font-weight="600" letter-spacing="3" fill="#ffd27a">SENSES</text>
  <text x="1620" y="300" text-anchor="middle" font-size="18" font-weight="600" letter-spacing="3" fill="#7ee2a8">BODY</text>

  <!-- Gemini -->
  <rect x="760" y="150" width="400" height="90" rx="16" fill="#16202e" stroke="#8ab4f8" stroke-width="2.5"/>
  <text x="960" y="189" text-anchor="middle" font-size="26" font-weight="700" fill="#8ab4f8">Gemini Flash</text>
  <text x="960" y="221" text-anchor="middle" font-size="18" fill="#9aa0a6">Vertex AI · cloud</text>
  <line x1="930" y1="310" x2="930" y2="244" stroke="#c4c8d0" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="990" y1="242" x2="990" y2="306" stroke="#c4c8d0" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="915" y="282" text-anchor="end" font-size="16" fill="#9aa0a6">context + webcam photo</text>
  <text x="1005" y="282" font-size="16" fill="#9aa0a6">question · need/want · verdict</text>

  <!-- Brain -->
  <rect x="660" y="310" width="600" height="470" rx="20" fill="#1e1519" stroke="#ff8fb1" stroke-width="3"/>
  <text x="690" y="355" font-size="28" font-weight="700" fill="#ff8fb1">brain.py</text>
  <text x="1230" y="355" text-anchor="end" font-size="18" fill="#9aa0a6">laptop · FastAPI :8000</text>

  <g font-size="20">
    <rect x="690" y="375" width="540" height="56" rx="10" fill="#2a1d23"/>
    <text x="710" y="410" font-weight="600" fill="#f1f3f5">Checkout session</text>
    <text x="1210" y="410" text-anchor="end" font-size="17" fill="#b8bcc4">2–3 questions per purchase</text>

    <rect x="690" y="439" width="540" height="56" rx="10" fill="#2a1d23"/>
    <text x="710" y="474" font-weight="600" fill="#f1f3f5">vision.py · MediaPipe</text>
    <text x="1210" y="474" text-anchor="end" font-size="17" fill="#b8bcc4">face tracking · eye contact</text>

    <rect x="690" y="503" width="540" height="56" rx="10" fill="#2a1d23"/>
    <text x="710" y="538" font-weight="600" fill="#f1f3f5">faster-whisper</text>
    <text x="1210" y="538" text-anchor="end" font-size="17" fill="#b8bcc4">speech → text</text>

    <rect x="690" y="567" width="540" height="56" rx="10" fill="#2a1d23"/>
    <text x="710" y="602" font-weight="600" fill="#f1f3f5">Budget rules</text>
    <text x="1210" y="602" text-anchor="end" font-size="17" fill="#b8bcc4">verdict can only get stricter</text>

    <rect x="690" y="631" width="540" height="56" rx="10" fill="#2a1d23"/>
    <text x="710" y="666" font-weight="600" fill="#f1f3f5">store.py</text>
    <text x="1210" y="666" text-anchor="end" font-size="17" fill="#b8bcc4">budget · goals · past arguments</text>

    <rect x="690" y="695" width="540" height="56" rx="10" fill="#2a1d23"/>
    <text x="710" y="730" font-weight="600" fill="#f1f3f5">macOS say</text>
    <text x="1210" y="730" text-anchor="end" font-size="17" fill="#b8bcc4">text → Piggyback's voice</text>
  </g>

  <!-- Senses (left) -->
  <rect x="120" y="320" width="360" height="130" rx="16" fill="#211d14" stroke="#ffd27a" stroke-width="2.5"/>
  <text x="145" y="362" font-size="25" font-weight="700" fill="#ffd27a">Chrome extension</text>
  <text x="145" y="394" font-size="18" fill="#b8bcc4">holds "Place order"</text>
  <text x="145" y="422" font-size="18" fill="#b8bcc4">reads cart, ads, sales</text>

  <rect x="120" y="500" width="360" height="110" rx="16" fill="#211d14" stroke="#ffd27a" stroke-width="2.5"/>
  <text x="145" y="545" font-size="25" font-weight="700" fill="#ffd27a">Webcam in the head</text>
  <text x="145" y="580" font-size="18" fill="#b8bcc4">sees your face and eyes</text>

  <rect x="120" y="660" width="360" height="110" rx="16" fill="#211d14" stroke="#ffd27a" stroke-width="2.5"/>
  <text x="145" y="705" font-size="25" font-weight="700" fill="#ffd27a">Laptop mic</text>
  <text x="145" y="740" font-size="18" fill="#b8bcc4">hears your answer</text>

  <!-- Senses → brain -->
  <line x1="482" y1="370" x2="656" y2="370" stroke="#c4c8d0" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="569" y="358" text-anchor="middle" font-size="15" fill="#9aa0a6">checkout · cart · ads</text>
  <line x1="658" y1="410" x2="484" y2="410" stroke="#c4c8d0" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="569" y="434" text-anchor="middle" font-size="15" fill="#9aa0a6">questions · verdict</text>

  <line x1="482" y1="555" x2="656" y2="555" stroke="#c4c8d0" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="569" y="543" text-anchor="middle" font-size="15" fill="#9aa0a6">video frames</text>

  <line x1="482" y1="715" x2="656" y2="715" stroke="#c4c8d0" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="569" y="703" text-anchor="middle" font-size="15" fill="#9aa0a6">your voice</text>

  <!-- Body (right) -->
  <rect x="1440" y="320" width="360" height="100" rx="16" fill="#14211a" stroke="#7ee2a8" stroke-width="2.5"/>
  <text x="1465" y="362" font-size="25" font-weight="700" fill="#7ee2a8">JBL speaker</text>
  <text x="1465" y="396" font-size="18" fill="#b8bcc4">Piggyback talks</text>

  <rect x="1440" y="480" width="360" height="110" rx="16" fill="#14211a" stroke="#7ee2a8" stroke-width="2.5"/>
  <text x="1465" y="523" font-size="25" font-weight="700" fill="#7ee2a8">ESP32 firmware</text>
  <text x="1465" y="558" font-size="18" fill="#b8bcc4">smooth, interruptible motion</text>

  <rect x="1440" y="650" width="170" height="100" rx="14" fill="#14211a" stroke="#7ee2a8" stroke-width="2.5"/>
  <text x="1525" y="693" text-anchor="middle" font-size="22" font-weight="700" fill="#7ee2a8">Pan servo</text>
  <text x="1525" y="725" text-anchor="middle" font-size="16" fill="#b8bcc4">head turns</text>

  <rect x="1630" y="650" width="170" height="100" rx="14" fill="#14211a" stroke="#7ee2a8" stroke-width="2.5"/>
  <text x="1715" y="693" text-anchor="middle" font-size="22" font-weight="700" fill="#7ee2a8">OLED eyes</text>
  <text x="1715" y="725" text-anchor="middle" font-size="16" fill="#b8bcc4">gaze · lids · mood</text>

  <!-- Brain → body -->
  <line x1="1262" y1="370" x2="1436" y2="370" stroke="#c4c8d0" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="1349" y="358" text-anchor="middle" font-size="15" fill="#9aa0a6">voice</text>

  <line x1="1262" y1="535" x2="1436" y2="535" stroke="#c4c8d0" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="1349" y="523" text-anchor="middle" font-size="15" fill="#9aa0a6">USB serial · JSON</text>
  <text x="1349" y="559" text-anchor="middle" font-size="14" fill="#9aa0a6">look · gaze · expr · stare</text>

  <line x1="1525" y1="592" x2="1525" y2="646" stroke="#c4c8d0" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="1513" y="625" text-anchor="end" font-size="15" fill="#9aa0a6">PWM</text>
  <line x1="1715" y1="592" x2="1715" y2="646" stroke="#c4c8d0" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="1727" y="625" font-size="15" fill="#9aa0a6">I2C</text>

  <!-- Closed loop: head carries the camera -->
  <path d="M1525,752 V830 H90 V555 H116" fill="none" stroke="#ff8fb1" stroke-width="2.5" stroke-dasharray="10 8" marker-end="url(#arrPink)"/>
  <rect x="700" y="812" width="520" height="36" rx="18" fill="#0f1115"/>
  <text x="960" y="837" text-anchor="middle" font-size="19" font-weight="600" fill="#ff8fb1">Closed loop: the camera rides on the head it turns</text>

  <!-- One checkout, step by step -->
  <text x="120" y="884" font-size="16" font-weight="600" letter-spacing="3" fill="#9aa0a6">ONE CHECKOUT</text>
  <g font-size="19">
    <rect x="120" y="900" width="260" height="90" rx="14" fill="#1a1d24" stroke="#2e3440" stroke-width="2"/>
    <text x="142" y="938" font-weight="700" fill="#f1f3f5"><tspan fill="#ff8fb1">1</tspan>  Place order</text>
    <text x="142" y="968" font-size="16" fill="#9aa0a6">held by the extension</text>

    <rect x="404" y="900" width="260" height="90" rx="14" fill="#1a1d24" stroke="#2e3440" stroke-width="2"/>
    <text x="426" y="938" font-weight="700" fill="#f1f3f5"><tspan fill="#ff8fb1">2</tspan>  Pig turns to you</text>
    <text x="426" y="968" font-size="16" fill="#9aa0a6">and asks why</text>

    <rect x="688" y="900" width="260" height="90" rx="14" fill="#1a1d24" stroke="#2e3440" stroke-width="2"/>
    <text x="710" y="938" font-weight="700" fill="#f1f3f5"><tspan fill="#ff8fb1">3</tspan>  Answer to its face</text>
    <text x="710" y="968" font-size="16" fill="#9aa0a6">eye contact required</text>

    <rect x="972" y="900" width="260" height="90" rx="14" fill="#1a1d24" stroke="#2e3440" stroke-width="2"/>
    <text x="994" y="938" font-weight="700" fill="#f1f3f5"><tspan fill="#ff8fb1">4</tspan>  Gemini + rules</text>
    <text x="994" y="968" font-size="16" fill="#9aa0a6">need or want?</text>

    <rect x="1256" y="900" width="260" height="90" rx="14" fill="#1a1d24" stroke="#2e3440" stroke-width="2"/>
    <text x="1278" y="938" font-weight="700" fill="#f1f3f5"><tspan fill="#ff8fb1">5</tspan>  Verdict</text>
    <text x="1278" y="968" font-size="16" fill="#9aa0a6">release · timer · escalate</text>

    <rect x="1540" y="900" width="260" height="90" rx="14" fill="#1a1d24" stroke="#2e3440" stroke-width="2"/>
    <text x="1562" y="938" font-weight="700" fill="#f1f3f5"><tspan fill="#ff8fb1">6</tspan>  3-second stare</text>
    <text x="1562" y="968" font-size="16" fill="#9aa0a6">to buy, or put it back</text>
  </g>
  <g fill="#5c6370" font-size="28" text-anchor="middle">
    <text x="392" y="955">›</text>
    <text x="676" y="955">›</text>
    <text x="960" y="955">›</text>
    <text x="1244" y="955">›</text>
    <text x="1528" y="955">›</text>
  </g>
</svg>
