; PlatformIO build for the Piggyback ESP32 firmware (VS Code + PlatformIO extension, or the `pio` CLI).
; The sketch stays in piggyback_esp32/ so Arduino IDE can still open it.
;
;   pio run -d firmware                      build
;   pio run -d firmware -t upload            build and flash (port is auto-detected)
;   pio device monitor -d firmware           serial monitor; type "demo" or "help"
;
; Close the monitor (and stop the brain) before uploading: only one program can hold the port.

[platformio]
src_dir = piggyback_esp32

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
monitor_echo = yes
monitor_filters = send_on_enter
monitor_eol = LF

lib_deps =
    bblanchon/ArduinoJson@^7
    adafruit/Adafruit SSD1306@^2.5
    adafruit/Adafruit GFX Library@^1.11
    madhephaestus/ESP32Servo@^3
