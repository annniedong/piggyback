; VS Code + PlatformIO: File > Open Folder > firmware/ (this folder), then use the toolbar at the
; bottom: check mark = build, arrow = upload, plug = serial monitor. Or from a terminal:
;   pio run -d firmware -t upload && pio device monitor -d firmware
; Builds firmware/pig_eyes/pig_eyes.ino, the same sketch Arduino IDE opens.

[platformio]
src_dir = pig_eyes

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  adafruit/Adafruit SSD1306
  adafruit/Adafruit GFX Library
  madhephaestus/ESP32Servo
